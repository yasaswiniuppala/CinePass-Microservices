server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-service
          uri: lb://user-service
          predicates: [Path=/api/auth/**]
        - id: movie-service
          uri: lb://movie-service
          predicates: [Path=/api/movies/**]
        - id: show-service
          uri: lb://show-service
          predicates: [Path=/api/shows/**]
        - id: booking-service
          uri: lb://booking-service
          predicates: [Path=/api/bookings/**]
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
app:
  jwt:
    secret: ${JWT_SECRET:ChangeThisDevelopmentSecretToAUnique32ByteMinimumValue!}
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
