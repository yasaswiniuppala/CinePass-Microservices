server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/movie_user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:movieapp}
    password: ${DB_PASSWORD:MovieApp@123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
app:
  jwt:
    secret: ${JWT_SECRET:ChangeThisDevelopmentSecretToAUnique32ByteMinimumValue!}
management:
  endpoints:
    web:
      exposure:
        include: health,info
